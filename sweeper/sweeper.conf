# myosSweeper Configuration
# Model preset: qwen25-1.5b (COA 1 default) | deepseek-r1-1.5b (COA 2)
MODEL_PRESET="qwen25-1.5b"
MODEL_PATH="/opt/myosSweeper/models/qwen2.5-1.5b-instruct-q4_k_m.gguf"
MODEL_SHA256="PIN_MODEL_SHA256_BEFORE_DEPLOY"

LLAMA_BIN="/opt/myosSweeper/bin/llama-cli"
LLAMA_SHA256="PIN_LLAMA_SHA256_BEFORE_DEPLOY"

# GPG signing key ID for baseline.json.asc (swap to SmartPGP card key in Gate 2)
SIGNING_KEY_ID="${SIGNING_KEY_ID:-}"
TRUSTED_KEYRING="${TRUSTED_KEYRING:-/etc/myosSweeper/trustedkey.gpg}"

# Desktop System 2 (Tailscale) escalation endpoint (optional)
DESKTOP_ENDPOINT="${DESKTOP_ENDPOINT:-}"
DESKTOP_TOKEN_FILE="${DESKTOP_TOKEN_FILE:-/etc/myosSweeper/desktop.token}"
DESKTOP_TIMEOUT_SEC="${DESKTOP_TIMEOUT_SEC:-5}"

# Comma-separated allowed listening ports on 0.0.0.0 / :: (empty = strict laptop default)
ALLOWED_EXTERNAL_PORTS="${ALLOWED_EXTERNAL_PORTS:-}"

STATE_DIR="${STATE_DIR:-/var/lib/myosSweeper}"
LOG_DIR="${LOG_DIR:-/var/log/myosSweeper}"
RUN_DIR="${RUN_DIR:-/run/myosSweeper}"
MANIFEST_PATH="${MANIFEST_PATH:-/opt/myosSweeper/manifest.sha256}"
